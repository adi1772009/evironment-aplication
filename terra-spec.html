<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Terra Spec</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; font-family: sans-serif; background: #F5F7F5; }

    /* scrollbar */
    .sb::-webkit-scrollbar { width: 4px; }
    .sb::-webkit-scrollbar-track { background: transparent; }
    .sb::-webkit-scrollbar-thumb { background: #81C784; border-radius: 10px; }

    /* ── DESKTOP layout ─────────────────────────────── */
    #app { display: none; flex-direction: column; min-height: 100vh; }

    #top-row {
      display: flex;
      gap: 12px;
      padding: 12px;
      flex: 1;
      min-height: 0;
    }

    #sidebar {
      width: 280px;
      flex-shrink: 0;
      border-radius: 24px;
      padding: 20px;
      border: 2px solid #333;
      background: #F1F8E9;
      display: flex;
      flex-direction: column;
      max-height: calc(100vh - 24px);
      position: sticky;
      top: 12px;
    }

    #fuel-btns {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
      overflow-y: auto;
    }

    #entry-panel {
      flex: 1;
      border-radius: 24px;
      border: 2px solid #333;
      background: #fff;
      overflow-y: auto;
    }

    #bottom-row {
      display: flex;
      justify-content: center;
      gap: 24px;
      padding: 0 12px 20px;
      flex-wrap: wrap;
    }

    .bottom-card {
      width: 450px;
      height: 400px;
      border-radius: 24px;
      border: 2px solid #333;
      background: #fff;
      padding: 22px;
      flex-shrink: 0;
    }

    /* Progress panel — desktop: right drawer */
    #prog-panel {
      display: none;
      position: fixed;
      top: 0; right: 0; bottom: 0;
      width: 440px;
      z-index: 50;
      background: #F0F7F0;
      border-left: 2px solid #333;
      flex-direction: column;
      box-shadow: -4px 0 24px rgba(0,0,0,0.12);
    }

    /* ── MOBILE layout ──────────────────────────────── */
    @media (max-width: 767px) {
      html, body { overflow: auto; }

      #top-row {
        flex-direction: column;
        padding: 10px;
        gap: 10px;
      }

      #sidebar {
        width: 100%;
        max-height: none;
        position: static;
        border-radius: 18px;
        padding: 16px;
      }

      /* Logo row on mobile: horizontal */
      #logo-block {
        flex-direction: row !important;
        align-items: center;
        gap: 12px;
        margin-bottom: 14px !important;
      }
      #logo-block svg { width: 52px !important; height: 52px !important; }
      #logo-block h1 { font-size: 1.3rem !important; margin: 0 !important; }

      /* Fuel buttons: horizontal scroll row */
      #fuel-btns {
        flex-direction: row;
        overflow-x: auto;
        overflow-y: hidden;
        flex: unset;
        gap: 8px;
        padding-bottom: 4px;
      }
      .fuel-btn {
        flex-shrink: 0;
        white-space: nowrap;
        padding: 8px 14px !important;
        font-size: 0.78rem !important;
      }

      #entry-panel {
        border-radius: 18px;
      }

      #bottom-row {
        flex-direction: column;
        align-items: stretch;
        padding: 0 10px 80px;
        gap: 12px;
      }

      .bottom-card {
        width: 100%;
        height: auto;
        min-height: 340px;
        padding: 16px;
        border-radius: 18px;
      }

      /* Chart canvas full width on mobile */
      #emi-chart { width: 100% !important; height: 240px !important; }

      /* Audit scrollbox */
      #audit { height: 260px; }

      /* Progress panel full screen on mobile */
      #prog-panel {
        width: 100% !important;
        border-left: none !important;
        border-top: 2px solid #333;
      }

      /* Mode buttons smaller */
      .mode-btn {
        padding: 7px 14px !important;
        font-size: 0.78rem !important;
      }

      /* Entry grid single column */
      #entry-grid {
        grid-template-columns: 1fr !important;
      }

      /* Footer credit */
      #footer-credit { display: none; }
    }

    @media (min-width: 768px) and (max-width: 1100px) {
      #sidebar { width: 230px; }
      .bottom-card { width: 380px; height: 380px; }
      #emi-chart { width: 330px !important; height: 270px !important; }
    }
  </style>
</head>
<body>

<!-- ═══════════ SPLASH ═══════════ -->
<div id="splash" style="position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;">
  <svg width="100" height="100" viewBox="0 0 95 95">
    <circle cx="47.5" cy="47.5" r="37.5" fill="#2E7D32" stroke="#1B5E20" stroke-width="2"/>
    <path d="M 15 47.5 A 32.5 32.5 0 0 1 80 47.5" fill="#81C784"/>
    <text x="47.5" y="55" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">CO2</text>
  </svg>
  <h1 style="margin-top:20px;font-size:2rem;font-weight:700;color:#2E7D32;letter-spacing:3px;">TERRA SPEC</h1>
</div>

<!-- ═══════════ APP ═══════════ -->
<div id="app">

  <div id="top-row">

    <!-- ── SIDEBAR ── -->
    <div id="sidebar">

      <!-- Logo block -->
      <div id="logo-block" style="display:flex;flex-direction:column;align-items:center;margin-bottom:18px;">
        <svg width="75" height="75" viewBox="0 0 95 95">
          <circle cx="47.5" cy="47.5" r="37.5" fill="#2E7D32" stroke="#1B5E20" stroke-width="2"/>
          <path d="M 15 47.5 A 32.5 32.5 0 0 1 80 47.5" fill="#81C784"/>
          <text x="47.5" y="55" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">CO2</text>
        </svg>
        <h1 style="margin-top:8px;font-size:1.2rem;font-weight:700;color:#2E7D32;letter-spacing:2px;">TERRA SPEC</h1>
      </div>

      <!-- Fuel buttons -->
      <div id="fuel-btns" class="sb"></div>

      <!-- Emission Progress button -->
      <button id="prog-btn" onclick="openProgress()"
        style="margin-top:14px;flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;border:1.5px solid #1B5E20;background:linear-gradient(135deg,#2E7D32,#1B5E20);color:#fff;font-weight:600;font-size:0.875rem;cursor:pointer;box-shadow:0 2px 12px rgba(46,125,50,0.3);width:100%;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>Emission Progress</span>
        <span id="sess-badge" style="display:none;background:#81C784;color:#1B5E20;font-size:0.68rem;font-weight:700;padding:2px 8px;border-radius:999px;"></span>
      </button>

      <!-- ── ABOUT & CONTACT ── -->
      <div style="margin-top:18px;padding-top:14px;border-top:1px dashed #A5D6A7;">
        <p style="font-size:0.68rem;font-weight:700;text-transform:uppercase;letter-spacing:0.12em;color:#81C784;margin:0 0 10px 0;">About &amp; Contact</p>
        <a id="about-link" href="#" onclick="return false;"
          style="display:flex;align-items:center;gap:8px;padding:7px 0;color:#2E7D32;text-decoration:none;font-size:0.82rem;font-weight:500;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
          About Terra Spec
        </a>
        <a id="contact-link" href="#" onclick="return false;"
          style="display:flex;align-items:center;gap:8px;padding:7px 0;color:#2E7D32;text-decoration:none;font-size:0.82rem;font-weight:500;">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
          Contact Us
        </a>
      </div>

    </div><!-- /sidebar -->

    <!-- ── ENTRY PANEL ── -->
    <div id="entry-panel" class="sb">
      <div style="padding:20px;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:10px;">
          <h2 id="panel-title" style="font-size:1.3rem;font-weight:700;color:#2E7D32;margin:0;"></h2>
          <div id="mode-btns" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
        </div>
        <div style="display:flex;justify-content:flex-end;margin-bottom:12px;">
          <button onclick="resetMode()" style="padding:7px 14px;border-radius:8px;border:1.5px solid #D32F2F;color:#D32F2F;background:transparent;font-weight:700;font-size:0.78rem;cursor:pointer;">↺ RESET CURRENT MODE</button>
        </div>
        <div id="entry-grid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"></div>
      </div>
    </div>

  </div><!-- /top-row -->

  <!-- ── BOTTOM ROW ── -->
  <div id="bottom-row">
    <div class="bottom-card">
      <h3 id="chart-title" style="font-size:0.95rem;font-weight:700;color:#2E7D32;margin:0 0 12px 0;"></h3>
      <canvas id="emi-chart" width="400" height="290"></canvas>
    </div>
    <div class="bottom-card">
      <h3 style="font-size:0.95rem;font-weight:700;color:#2E7D32;margin:0 0 12px 0;">ENVIRONMENTAL AUDIT</h3>
      <div id="audit" style="height:310px;overflow-y:auto;padding:14px;border-radius:14px;background:#FAFAFA;font-family:monospace;font-size:0.78rem;line-height:1.75;color:#222;" class="sb"></div>
    </div>
  </div>

  <!-- Footer credit -->

</div><!-- /app -->

<!-- ═══════════ PROGRESS PANEL ═══════════ -->
<div id="prog-panel" class="sb">

  <div id="prog-header" style="background:linear-gradient(160deg,#1B5E20 0%,#2E7D32 60%,#388E3C 100%);padding:20px 20px 0 20px;flex-shrink:0;">

    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="background:rgba(255,255,255,0.15);border-radius:10px;padding:8px;display:flex;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        </div>
        <div>
          <div style="font-size:1.05rem;font-weight:700;color:#fff;">Emission Progress</div>
          <div id="days-label" style="font-size:0.7rem;color:#A5D6A7;margin-top:2px;"></div>
        </div>
      </div>
      <button onclick="closeProgress()" style="background:transparent;border:none;cursor:pointer;padding:8px;border-radius:10px;color:#fff;display:flex;">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <!-- Hero -->
    <div style="background:rgba(0,0,0,0.18);border-radius:16px;padding:16px;margin-bottom:14px;">
      <div style="font-size:0.68rem;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:#A5D6A7;margin-bottom:6px;">Total CO₂ Logged</div>
      <div style="display:flex;align-items:flex-end;gap:8px;">
        <span id="hero-co2" style="font-size:1.9rem;font-weight:700;color:#fff;">0</span>
        <span style="font-size:0.82rem;font-weight:500;color:#A5D6A7;margin-bottom:4px;">kg CO₂</span>
        <div id="compliance-badge" style="margin-left:auto;display:flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;"></div>
      </div>
    </div>

    <!-- Stat tiles -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:14px;">
      <div style="background:rgba(255,255,255,0.1);border-radius:12px;padding:10px;">
        <div style="font-size:0.65rem;color:#A5D6A7;margin-bottom:3px;">Sessions</div>
        <div id="stat-sessions" style="font-size:1.3rem;font-weight:700;color:#fff;">0</div>
      </div>
      <div style="background:rgba(255,255,255,0.1);border-radius:12px;padding:10px;">
        <div style="font-size:0.65rem;color:#A5D6A7;margin-bottom:3px;">Fuels Used</div>
        <div id="stat-fuels" style="font-size:1.3rem;font-weight:700;color:#fff;">0</div>
      </div>
      <div style="background:rgba(255,255,255,0.1);border-radius:12px;padding:10px;">
        <div style="font-size:0.65rem;color:#A5D6A7;margin-bottom:3px;">Days Active</div>
        <div id="stat-days" style="font-size:1.3rem;font-weight:700;color:#fff;">0</div>
      </div>
    </div>

    <!-- Tabs -->
    <div style="display:flex;border-bottom:1px solid rgba(255,255,255,0.15);">
      <button id="tab-overview" onclick="switchTab('overview')"
        style="padding:10px 20px;font-size:0.85rem;font-weight:600;background:transparent;border:none;color:#fff;cursor:pointer;border-bottom:2px solid #81C784;margin-bottom:-1px;">
        Overview
      </button>
      <button id="tab-sessions" onclick="switchTab('sessions')"
        style="padding:10px 20px;font-size:0.85rem;font-weight:600;background:transparent;border:none;color:rgba(255,255,255,0.5);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;">
        Sessions
      </button>
    </div>
  </div>

  <div id="prog-body" style="flex:1;overflow-y:auto;padding:14px;" class="sb"></div>

  <div id="prog-footer" style="display:none;padding:12px 16px;border-top:1.5px solid #C8E6C9;background:#F0F7F0;flex-shrink:0;">
    <button onclick="clearHistory()" style="width:100%;padding:10px;border-radius:12px;border:1.5px solid #D32F2F;color:#D32F2F;background:transparent;font-weight:600;font-size:0.85rem;cursor:pointer;">
      Clear All History
    </button>
  </div>
</div>

<script>
// ─── Constants ────────────────────────────────────────────────────────────────
const FACTORS    = { petrol:2.31, diesel:2.68, coal:2.42, firewood:1.65, lpg:2.98, cng:2.66, electricity:0.85 };
const PERIODS    = { Daily:7, Weekly:4, Monthly:6, Yearly:5 };
const THRESHOLDS = { Daily:15, Weekly:100, Monthly:5000, Yearly:100000 };
const HISTORY_KEY= 'terraspec_activity_history';
const MAX_HISTORY= 300;
const UNIT_MAP   = { petrol:'liters', diesel:'liters', coal:'kg', firewood:'kg', lpg:'kg', cng:'m³', electricity:'kWh' };
const FUEL_COLORS= { petrol:'#1565C0', diesel:'#4527A0', coal:'#37474F', firewood:'#6D4C41', lpg:'#00838F', cng:'#2E7D32', electricity:'#F9A825' };

const FUEL_SVG = {
  petrol:      `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>`,
  diesel:      `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>`,
  coal:        `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 2.5z"/></svg>`,
  firewood:    `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 8a5 5 0 0 0-10 0c0 5 5 12 5 12s5-7 5-12z"/></svg>`,
  lpg:         `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 10 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>`,
  cng:         `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.59 4.59A2 2 0 1 1 11 8H2m10.59 11.41A2 2 0 1 0 10 16H2m15.73-8.27A2.5 2.5 0 1 1 19.5 12H2"/></svg>`,
  electricity: `<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`
};

const ADVICE = {
  petrol:      { high:["Review logistics routes to optimize fuel usage.","Transition fleet to hybrid/EV models to lower long-term overhead."], stable:["Sustainable consumption levels. Maintain current logistical efficiency."] },
  diesel:      { high:["Review logistics routes to optimize fuel usage.","Transition fleet to hybrid/EV models to lower long-term overhead."], stable:["Sustainable consumption levels. Maintain current logistical efficiency."] },
  coal:        { high:["Exceeding industrial benchmarks. Consider upgrading scrubbers or transitioning to Natural Gas.","Implement heat recovery systems to maximize energy extraction from coal combustion."], stable:["Emissions are within corporate compliance levels for this period."] },
  electricity: { high:["Install solar arrays to offset grid dependency.","Conduct a facility-wide energy audit to identify hardware inefficiencies."], stable:["Efficient electricity profile. Continue monitoring peak-load times."] },
  firewood:    { high:["Analyze machinery duty cycles for energy savings.","Continue scheduled maintenance to ensure peak efficiency."], stable:["Sustainable consumption levels."] },
  lpg:         { high:["Analyze machinery duty cycles for energy savings.","Continue scheduled maintenance to ensure peak efficiency."], stable:["Sustainable consumption levels."] },
  cng:         { high:["Analyze machinery duty cycles for energy savings.","Continue scheduled maintenance to ensure peak efficiency."], stable:["Sustainable consumption levels."] }
};

// ─── State ────────────────────────────────────────────────────────────────────
let fuel='petrol', mode='Daily', entries=[], chartInst=null, debTimer=null, activeTab='overview';

// ─── History ──────────────────────────────────────────────────────────────────
function loadHistory() { try { return JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]'); } catch { return []; } }
function saveHistory(r){ localStorage.setItem(HISTORY_KEY, JSON.stringify(r.slice(-MAX_HISTORY))); }
function pushActivity(obj) {
  const h = loadHistory();
  h.push({ ...obj, id:`${Date.now()}_${Math.random().toString(36).slice(2,7)}`, timestamp:Date.now() });
  saveHistory(h);
  refreshBadge();
}
function clearHistory(){ localStorage.removeItem(HISTORY_KEY); refreshBadge(); renderProgressBody(); }
function refreshBadge(){
  const sessions = loadHistory().filter(r=>r.type==='session_start').length;
  const b = document.getElementById('sess-badge');
  b.textContent = sessions;
  b.style.display = sessions > 0 ? 'inline' : 'none';
}

// ─── Stats ────────────────────────────────────────────────────────────────────
function computeFuelStats(){
  return Object.keys(FACTORS).map(f=>{
    let totalCO2=0, sessions=0, compliant=0;
    Object.keys(PERIODS).forEach(m=>{
      const raw = localStorage.getItem(`${f}_${m}`);
      if (!raw) return;
      const nums = JSON.parse(raw).map(v=>parseFloat(v)||0);
      const co2  = nums.reduce((s,v)=>s+v*FACTORS[f],0);
      if (co2>0){ sessions++; totalCO2+=co2; if((co2/nums.length)<=THRESHOLDS[m]) compliant++; }
    });
    return { fuel:f, totalCO2:parseFloat(totalCO2.toFixed(2)), sessions, compliance:sessions?Math.round((compliant/sessions)*100):100 };
  }).filter(s=>s.sessions>0).sort((a,b)=>b.totalCO2-a.totalCO2);
}

function computeOverallStats(h){
  const sessions = h.filter(r=>r.type==='session_start').length;
  const de       = h.filter(r=>r.type==='data_entry');
  const totalCO2 = parseFloat(de.reduce((s,r)=>s+(r.totalEmissions||0),0).toFixed(2));
  const daysActive = new Set(h.map(r=>new Date(r.timestamp).toDateString())).size;
  const fuelsUsed  = new Set(de.map(r=>r.fuel)).size;
  return { sessions, totalCO2, daysActive, fuelsUsed };
}

function computeWeeklyBars(h){
  const bars=[];
  for(let i=6;i>=0;i--){
    const d=new Date(); d.setDate(d.getDate()-i);
    const ds=d.toDateString();
    const label = i===0?'Today':d.toLocaleDateString([],{weekday:'short'});
    const co2   = h.filter(r=>r.type==='data_entry'&&new Date(r.timestamp).toDateString()===ds).reduce((s,r)=>s+(r.totalEmissions||0),0);
    bars.push({ label, co2:parseFloat(co2.toFixed(1)), isToday:i===0 });
  }
  return bars;
}

// ─── Progress panel ───────────────────────────────────────────────────────────
function openProgress(){ const p=document.getElementById('prog-panel'); p.style.display='flex'; renderProgressHeader(); renderProgressBody(); }
function closeProgress(){ document.getElementById('prog-panel').style.display='none'; }

function switchTab(t){
  activeTab=t;
  ['overview','sessions'].forEach(id=>{
    const btn=document.getElementById('tab-'+id);
    btn.style.color        = id===t ? '#fff' : 'rgba(255,255,255,0.5)';
    btn.style.borderBottom = id===t ? '2px solid #81C784' : '2px solid transparent';
  });
  renderProgressBody();
}

function renderProgressHeader(){
  const h=loadHistory(), stats=computeOverallStats(h), fs=computeFuelStats();
  const oc = fs.length ? Math.round(fs.reduce((s,f)=>s+f.compliance,0)/fs.length) : 100;
  const isGood = oc>=70;
  document.getElementById('days-label').textContent   = `${stats.daysActive} day${stats.daysActive!==1?'s':''} tracked`;
  document.getElementById('hero-co2').textContent     = stats.totalCO2.toLocaleString('en-US',{maximumFractionDigits:1});
  document.getElementById('stat-sessions').textContent= stats.sessions;
  document.getElementById('stat-fuels').textContent   = stats.fuelsUsed;
  document.getElementById('stat-days').textContent    = stats.daysActive;
  const badge=document.getElementById('compliance-badge');
  badge.style.backgroundColor = isGood?'rgba(129,199,132,0.25)':'rgba(211,47,47,0.25)';
  badge.innerHTML=`<svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${isGood?'#81C784':'#EF9A9A'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${isGood?'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>':'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>'}</svg>
    <span style="font-size:0.7rem;font-weight:700;color:${isGood?'#81C784':'#EF9A9A'};">${oc}% compliant</span>`;
  document.getElementById('prog-footer').style.display = h.length>0?'block':'none';
}

function renderProgressBody(){
  renderProgressHeader();
  const h=loadHistory(), fs=computeFuelStats(), body=document.getElementById('prog-body');
  if(activeTab==='overview'){
    const wb=computeWeeklyBars(h), maxW=Math.max(...wb.map(d=>d.co2),1);
    const oc=fs.length?Math.round(fs.reduce((s,f)=>s+f.compliance,0)/fs.length):100;
    const isGood=oc>=70, ringStroke=(oc/100)*175.9;

    const barsHtml=wb.map(d=>{
      const pct=maxW>0?(d.co2/maxW)*100:0;
      return `<div style="display:flex;flex-direction:column;align-items:center;gap:5px;flex:1;">
        <div style="width:100%;display:flex;flex-direction:column;justify-content:flex-end;height:54px;">
          <div style="width:100%;border-radius:4px 4px 0 0;background:${d.isToday?'#2E7D32':'#81C784'};opacity:${d.isToday?1:0.7};height:${Math.max(pct,d.co2>0?6:0)}%;min-height:${d.co2>0?'4px':'0'};"></div>
        </div>
        <span style="font-size:0.6rem;font-weight:500;color:${d.isToday?'#2E7D32':'#888'};">${d.label}</span>
      </div>`;
    }).join('');

    const maxFCO2=fs.length?fs[0].totalCO2:1;
    const fuelRowsHtml=fs.length===0
      ? `<p style="text-align:center;color:#aaa;padding:14px 0;font-size:0.85rem;">No fuel data recorded yet.</p>`
      : fs.map((fst,i)=>{
          const pct=maxFCO2>0?(fst.totalCO2/maxFCO2)*100:0, fc=FUEL_COLORS[fst.fuel], up=fst.compliance<70;
          return `<div>
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;">
              <div style="display:flex;align-items:center;gap:8px;">
                <div style="padding:6px;border-radius:8px;background:${fc}18;color:${fc};display:flex;">${FUEL_SVG[fst.fuel]}</div>
                <span style="font-size:0.85rem;font-weight:600;color:#1B5E20;text-transform:capitalize;">${fst.fuel}</span>
                ${i===0?`<span style="font-size:0.65rem;padding:2px 6px;border-radius:999px;font-weight:700;background:#FFF3E0;color:#F57F17;">Most</span>`:''}
              </div>
              <div style="display:flex;align-items:center;gap:6px;">
                <span style="font-size:0.75rem;font-weight:700;color:#1B5E20;">${fst.totalCO2.toFixed(1)} kg</span>
                <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${up?'#D32F2F':'#2E7D32'}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${up?'<polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/>':'<polyline points="23 18 13.5 8.5 8.5 13.5 1 6"/><polyline points="17 18 23 18 23 12"/>'}</svg>
              </div>
            </div>
            <div style="width:100%;border-radius:999px;overflow:hidden;height:6px;background:#E8F5E9;">
              <div style="width:${pct}%;height:100%;background:${fc};border-radius:999px;"></div>
            </div>
            <div style="display:flex;justify-content:space-between;margin-top:3px;">
              <span style="font-size:0.7rem;color:#aaa;">${fst.sessions} period${fst.sessions!==1?'s':''} tracked</span>
              <span style="font-size:0.7rem;font-weight:500;color:${fst.compliance>=70?'#2E7D32':'#D32F2F'};">${fst.compliance}% compliant</span>
            </div>
          </div>`;
        }).join('');

    const ringRows=fs.slice(0,3).map(fst=>`
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <span style="font-size:0.75rem;text-transform:capitalize;color:#555;">${fst.fuel}</span>
        <div style="display:flex;align-items:center;gap:6px;">
          <div style="width:48px;height:4px;border-radius:999px;background:#E8F5E9;overflow:hidden;">
            <div style="width:${fst.compliance}%;height:100%;background:${fst.compliance>=70?'#2E7D32':'#D32F2F'};border-radius:999px;"></div>
          </div>
          <span style="font-size:0.7rem;font-weight:700;width:28px;text-align:right;color:${fst.compliance>=70?'#2E7D32':'#D32F2F'};">${fst.compliance}%</span>
        </div>
      </div>`).join('');

    body.innerHTML=`
      <div style="border-radius:14px;padding:14px;background:#fff;border:1.5px solid #D0E8D0;margin-bottom:12px;">
        <p style="font-size:0.67rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#1B5E20;margin:0 0 10px 0;">Last 7 Days</p>
        <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:5px;height:75px;">${barsHtml}</div>
      </div>
      <div style="border-radius:14px;padding:14px;background:#fff;border:1.5px solid #D0E8D0;margin-bottom:12px;">
        <p style="font-size:0.67rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#1B5E20;margin:0 0 12px 0;">Fuel Breakdown</p>
        <div style="display:flex;flex-direction:column;gap:13px;">${fuelRowsHtml}</div>
      </div>
      ${fs.length>0?`
      <div style="border-radius:14px;padding:14px;background:#fff;border:1.5px solid #D0E8D0;">
        <p style="font-size:0.67rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#1B5E20;margin:0 0 12px 0;">Compliance Overview</p>
        <div style="display:flex;align-items:center;gap:14px;">
          <svg width="68" height="68" viewBox="0 0 72 72" style="flex-shrink:0;">
            <circle cx="36" cy="36" r="28" fill="none" stroke="#E8F5E9" stroke-width="8"/>
            <circle cx="36" cy="36" r="28" fill="none" stroke="${isGood?'#2E7D32':'#D32F2F'}" stroke-width="8"
              stroke-dasharray="${ringStroke} 175.9" stroke-linecap="round" transform="rotate(-90 36 36)"/>
            <text x="36" y="41" text-anchor="middle" font-size="13" font-weight="bold" fill="#1B5E20">${oc}%</text>
          </svg>
          <div style="flex:1;display:flex;flex-direction:column;gap:9px;">${ringRows}</div>
        </div>
      </div>`:''}`;
  } else {
    const recs=[...h].filter(r=>r.type==='data_entry').reverse().slice(0,30);
    if(!recs.length){
      body.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 0;gap:10px;color:#aaa;">
        <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#81C784" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/></svg>
        <p style="font-size:0.875rem;font-weight:500;margin:0;">No data entries yet.</p>
        <p style="font-size:0.75rem;text-align:center;color:#bbb;margin:0;padding:0 16px;">Enter fuel values to start tracking.</p></div>`;
      return;
    }
    body.innerHTML=recs.map(r=>{
      const fc=FUEL_COLORS[r.fuel];
      const ds=new Date(r.timestamp).toLocaleDateString([],{month:'short',day:'numeric'});
      const ts=new Date(r.timestamp).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      const thresh=THRESHOLDS[r.mode], avg=(r.totalEmissions||0)/(r.entryCount||1);
      const pct=Math.min((avg/thresh)*100,100), isOver=avg>thresh;
      return `<div style="border-radius:14px;padding:14px;background:#fff;border:1.5px solid #D0E8D0;margin-bottom:10px;">
        <div style="display:flex;align-items:center;gap:10px;">
          <div style="padding:9px;border-radius:11px;background:${fc}18;color:${fc};display:flex;flex-shrink:0;">${FUEL_SVG[r.fuel]}</div>
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <span style="font-size:0.85rem;font-weight:700;color:#1B5E20;text-transform:capitalize;">${r.fuel}</span>
              <span style="font-size:0.7rem;color:#999;">${ds} · ${ts}</span>
            </div>
            <div style="display:flex;align-items:center;gap:7px;margin-top:4px;flex-wrap:wrap;">
              <span style="font-size:0.7rem;padding:2px 7px;border-radius:999px;background:#F1F8E9;color:#1B5E20;">${r.mode}</span>
              <span style="font-size:0.72rem;font-weight:600;color:#2E7D32;">${(r.totalEmissions||0).toFixed(2)} kg CO₂</span>
              <span style="font-size:0.7rem;color:#aaa;">${r.entryCount} ${r.entryCount===1?'entry':'entries'}</span>
            </div>
          </div>
        </div>
        <div style="margin-top:10px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:3px;">
            <span style="font-size:0.7rem;color:#aaa;">Avg vs limit</span>
            <span style="font-size:0.7rem;font-weight:500;color:${isOver?'#D32F2F':'#2E7D32'};">${isOver?'⚠ Over limit':'✓ Within limit'}</span>
          </div>
          <div style="border-radius:999px;overflow:hidden;height:5px;background:#E8F5E9;">
            <div style="width:${pct}%;height:100%;background:${isOver?'#D32F2F':'#2E7D32'};border-radius:999px;"></div>
          </div>
        </div>
      </div>`;
    }).join('');
  }
}

// ─── Chart ────────────────────────────────────────────────────────────────────
function renderChart(ems){
  const canvas=document.getElementById('emi-chart');
  // Responsive width
  const isMobile=window.innerWidth<768;
  canvas.width  = isMobile ? canvas.parentElement.clientWidth-32 : 400;
  canvas.height = isMobile ? 240 : 290;
  const ctx=canvas.getContext('2d');
  if(chartInst) chartInst.destroy();
  chartInst=new Chart(ctx,{
    type:'line',
    data:{ labels:ems.map((_,i)=>i+1), datasets:[{ label:'Emissions (kg CO₂)', data:ems, borderColor:'#2E7D32', borderWidth:2.5, pointBackgroundColor:'#2E7D32', pointRadius:4, fill:true,
      backgroundColor:c=>{ const g=c.chart.ctx.createLinearGradient(0,0,0,canvas.height); g.addColorStop(0,'rgba(129,199,132,0.3)'); g.addColorStop(1,'rgba(129,199,132,0)'); return g; }, tension:0.4 }] },
    options:{ responsive:false, plugins:{ legend:{display:false}, tooltip:{callbacks:{label:c=>`${c.parsed.y.toFixed(2)} kg CO₂`}} }, scales:{ x:{grid:{color:'rgba(0,0,0,0.06)'}}, y:{grid:{color:'rgba(0,0,0,0.06)'},beginAtZero:true} } }
  });
}

// ─── Audit ────────────────────────────────────────────────────────────────────
function renderAudit(){
  const factor=FACTORS[fuel], nums=entries.map(v=>parseFloat(v)||0);
  const ems=nums.map(v=>v*factor), total=ems.reduce((s,v)=>s+v,0);
  const avg=ems.length?total/ems.length:0, limit=THRESHOLDS[mode], isHigh=avg>limit;
  const tips=ADVICE[fuel][isHigh?'high':'stable'], line='━'.repeat(32);
  document.getElementById('audit').innerHTML=`<b>[ ${fuel.toUpperCase()} CORPORATE AUDIT ]</b><br>${line}<br>
    • Total Emissions : ${total.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})} kg CO2<br>
    • Intensity/Period: ${avg.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})} kg<br>
    • Compliance Limit: ${limit.toLocaleString('en-US',{maximumFractionDigits:0})} kg<br>${line}<br>
    <b>AUDIT STATUS:</b><br>&gt;&gt; ${isHigh?'⚠️ REDUCTION MANDATED':'✅ WITHIN COMPLIANCE'}<br><br>
    <b>STRATEGIC ADVICE:</b><br>${tips.map((t,i)=>`${i+1}. ${t}`).join('<br><br>')}`;
}

// ─── Entry grid ───────────────────────────────────────────────────────────────
function getLabelPrefix(){ return {Daily:'Day',Weekly:'Week',Monthly:'Month',Yearly:'Year'}[mode]; }

function renderEntryGrid(){
  const grid=document.getElementById('entry-grid');
  grid.innerHTML='';
  const count=PERIODS[mode], prefix=getLabelPrefix(), unit=UNIT_MAP[fuel];
  for(let i=0;i<count;i++){
    const row=document.createElement('div');
    row.style.cssText='display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:#F1F8E9;';
    row.innerHTML=`<label style="font-weight:700;color:#1B5E20;min-width:66px;flex-shrink:0;font-size:0.85rem;">${prefix} ${i+1}:</label>
      <input type="text" data-i="${i}" value="${entries[i]||''}" placeholder="${unit}"
        style="flex:1;padding:8px 10px;border-radius:8px;border:1.5px solid #333;background:#fff;font-size:0.875rem;outline:none;min-width:0;"/>`;
    grid.appendChild(row);
  }
  grid.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input',e=>{ entries[parseInt(e.target.dataset.i)]=e.target.value; persistEntries(); updateDerived(); scheduleHistoryEntry(); });
  });
}

function updateDerived(){
  const ems=entries.map(v=>(parseFloat(v)||0)*FACTORS[fuel]);
  document.getElementById('chart-title').textContent=fuel.charAt(0).toUpperCase()+fuel.slice(1)+' Trend';
  renderChart(ems); renderAudit();
}

function persistEntries(){ localStorage.setItem(`${fuel}_${mode}`,JSON.stringify(entries)); }
function loadEntries(){ const raw=localStorage.getItem(`${fuel}_${mode}`); entries=raw?JSON.parse(raw):Array(PERIODS[mode]).fill(''); }

function scheduleHistoryEntry(){
  if(debTimer) clearTimeout(debTimer);
  debTimer=setTimeout(()=>{
    const nums=entries.map(v=>parseFloat(v)||0), filled=nums.filter(n=>n>0);
    if(!filled.length) return;
    const totalEm=nums.reduce((s,v)=>s+v*FACTORS[fuel],0);
    pushActivity({fuel,mode,type:'data_entry',totalEmissions:parseFloat(totalEm.toFixed(2)),entryCount:filled.length});
  },1500);
}

// ─── UI builders ─────────────────────────────────────────────────────────────
function renderFuelBtns(){
  const c=document.getElementById('fuel-btns'); c.innerHTML='';
  Object.keys(FACTORS).sort().forEach(f=>{
    const b=document.createElement('button');
    b.textContent=f.toUpperCase();
    b.className='fuel-btn';
    b.style.cssText=`padding:10px 14px;border-radius:8px;border:1.5px solid #333;background:${f===fuel?'#81C784':'#fff'};color:#1B5E20;font-weight:600;font-size:0.85rem;cursor:pointer;text-align:left;`;
    b.onclick=()=>switchFuel(f);
    c.appendChild(b);
  });
}

function renderModeBtns(){
  const c=document.getElementById('mode-btns'); c.innerHTML='';
  Object.keys(PERIODS).forEach(m=>{
    const b=document.createElement('button');
    b.textContent=m; b.className='mode-btn';
    b.style.cssText=`padding:7px 18px;border-radius:8px;border:1.5px solid #333;background:${m===mode?'#2E7D32':'#E0E0E0'};color:${m===mode?'#fff':'#1B5E20'};font-weight:600;font-size:0.85rem;cursor:pointer;`;
    b.onclick=()=>switchMode(m);
    c.appendChild(b);
  });
}

function switchFuel(f){ if(f===fuel) return; fuel=f; pushActivity({fuel:f,mode,type:'fuel_switch'}); loadEntries(); renderFuelBtns(); document.getElementById('panel-title').textContent=f.toUpperCase()+' ANALYSIS'; renderEntryGrid(); updateDerived(); }
function switchMode(m){ if(m===mode) return; mode=m; pushActivity({fuel,mode:m,type:'mode_switch'}); loadEntries(); renderModeBtns(); renderEntryGrid(); updateDerived(); }
function resetMode(){ localStorage.removeItem(`${fuel}_${mode}`); entries=Array(PERIODS[mode]).fill(''); pushActivity({fuel,mode,type:'reset'}); renderEntryGrid(); updateDerived(); }

// ─── Resize handler ───────────────────────────────────────────────────────────
window.addEventListener('resize', ()=>{ const ems=entries.map(v=>(parseFloat(v)||0)*FACTORS[fuel]); renderChart(ems); });

// ─── Boot ─────────────────────────────────────────────────────────────────────
function boot(){
  document.getElementById('splash').style.display='none';
  document.getElementById('app').style.display='flex';
  pushActivity({fuel,mode,type:'session_start'});
  loadEntries();
  document.getElementById('panel-title').textContent=fuel.toUpperCase()+' ANALYSIS';
  renderFuelBtns(); renderModeBtns(); renderEntryGrid(); updateDerived();
}
setTimeout(boot, 3000);
</script>
</body>
</html>
